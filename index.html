<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>퀴즈 탐험대 함께하기</title>
<meta name="description" content="반 친구들과 같은 맵에서 동시에 푸는 퀴즈 게임. 선생님 관리자 모드에서 반·학생·기록을 관리해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 지도 표지판 UI: 크림색 종이 카드 + 진한 먹선 테두리, 청록 길잡이, 금빛 행동 버튼 */
  --paper:#fffaf1;--paper-2:#f4ecdc;--ink:#24323c;--muted:#66747d;--line:#e6dbc6;
  --teal:#1d8a87;--teal-d:#146a68;--gold:#f2a531;--gold-d:#c97f14;--navy:#1f2b3a;
  --ok:#2c9f57;--bad:#d9483f;--ox:#3b82f6;--mc:#f08c2a;--short:#8b5cf6;
  --font-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#cfe6c4;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,250,241,.25),rgba(255,250,241,.62));transition:opacity .4s}
body.playing #veil{opacity:0}
#ui{position:fixed;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;overflow-y:auto;pointer-events:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
#scr-home.on{display:grid;place-items:center}
#scr-game{pointer-events:none;overflow:hidden;padding:0}
#scr-game .pe{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.ic{display:inline-flex;width:18px;height:18px;flex:none}.ic svg{width:100%;height:100%}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}.grow{flex:1}
.eyebrow{font-family:var(--font-display);color:var(--teal);font-size:16px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-family:var(--font-display);font-size:17px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08),inset 0 0 0 1.5px var(--line);transition:transform .08s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.btn.gold{background:var(--gold);color:#3b2600;box-shadow:0 3px 0 var(--gold-d)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 3px 0 #a5322b}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:6px 12px;font-size:15px}
.btn.big{font-size:21px;padding:13px 26px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink);font-size:17px;flex:none}
.icon-btn:hover:not(:disabled){background:var(--paper-2)}.icon-btn.danger{color:var(--bad)}.icon-btn:disabled{opacity:.28}
.link-btn{border:0;background:none;color:var(--teal-d);font-family:var(--font-display);font-size:17px;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.t-ox-btn{box-shadow:inset 0 0 0 2px var(--ox);color:#1e4fae}.t-mc-btn{box-shadow:inset 0 0 0 2px var(--mc);color:#a65200}.t-short-btn{box-shadow:inset 0 0 0 2px var(--short);color:#5b31b5}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-family:var(--font-display);font-size:14px;color:#fff;line-height:1.55;white-space:nowrap}
.chip.t-ox{background:var(--ox)}.chip.t-mc{background:var(--mc)}.chip.t-short{background:var(--short)}
.tag{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--paper-2);color:var(--muted);margin-left:6px}.tag.warn{background:#ffe8c2;color:#9a5200}

/* 공용 카드 · 페이지 머리 */
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
.wrap.narrow{max-width:760px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(52,44,24,.10);display:grid;gap:8px;align-content:start}
.card-title{font-size:22px}
.page-head,.ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,250,241,.94);border:1px solid var(--line);border-radius:18px;padding:10px 14px;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);box-shadow:0 6px 16px rgba(52,44,24,.08)}
.page-head h2{font-size:26px}
.row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.row-wrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.empty{text-align:center;padding:28px 12px;background:rgba(255,250,241,.9);border:2px dashed var(--line);border-radius:18px;grid-column:1/-1;display:grid;gap:4px}
.empty b{font-family:var(--font-display);font-weight:400;font-size:19px}

/* 홈 */
.home{max-width:1120px;width:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
.home-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:30px;padding:clamp(22px,4vw,38px);box-shadow:0 10px 0 var(--ink),0 30px 60px rgba(30,40,20,.18);display:grid;gap:14px}
.logo{display:flex;gap:.12em;flex-wrap:wrap;font-size:clamp(42px,7.4vw,74px);line-height:1;margin:4px 0}
.logo span{display:inline-grid;place-items:center;width:1.22em;height:1.22em;background:var(--paper);border:3px solid var(--ink);border-radius:.26em;box-shadow:0 .08em 0 var(--ink);color:var(--teal);animation:drop .55s cubic-bezier(.3,1.45,.5,1) both;animation-delay:calc(var(--i)*.08s)}
.logo span:nth-child(odd){rotate:-4deg}.logo span:nth-child(even){rotate:3deg}
.logo span.alt{background:var(--teal);color:#fff8e6}
.logo .gap{width:.18em;border:0;background:none;box-shadow:none;animation:none}
.lead{font-size:18px;max-width:32em;color:#3c4a53}
.home-actions{display:grid;gap:12px;margin-top:6px}
.big-btn{display:flex;align-items:center;gap:14px;text-align:left;border:2.5px solid var(--ink);border-radius:18px;padding:14px 18px;background:#fff;box-shadow:0 5px 0 var(--ink);font-family:var(--font-display);font-size:23px;transition:transform .08s,box-shadow .08s}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big-btn small{display:block;font-family:var(--font-body);font-size:15px;color:#54606a;margin-top:2px}
.big-btn.student{background:var(--gold)}.big-btn.student small{color:#5a3d00}
.bb-ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.65);display:grid;place-items:center;flex:none}.bb-ic svg{width:30px;height:30px}
.home-maps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.map-card{margin:0;background:var(--paper);border-radius:16px;padding:8px 8px 10px;border:1px solid var(--line);box-shadow:0 10px 24px rgba(30,40,20,.16);display:grid;gap:6px}
.map-card:nth-child(1){rotate:-2deg}.map-card:nth-child(2){rotate:1.5deg;translate:0 14px}.map-card:nth-child(3){rotate:1deg}.map-card:nth-child(4){rotate:-1.5deg;translate:0 14px}
.map-card img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:#dfe9d4}
.map-card figcaption{display:grid;padding:0 4px}.map-card b{font-family:var(--font-display);font-weight:400;font-size:18px}.map-card span{font-size:13px;color:var(--muted)}
@media (max-width:880px){.home{grid-template-columns:1fr;gap:20px}.home-maps{grid-template-columns:repeat(4,1fr);gap:10px}.map-card span{display:none}.map-card b{font-size:15px}.map-card:nth-child(n){rotate:0deg;translate:0 0}#scr-home.on{place-items:start center}}
@media (max-width:520px){.home-maps{grid-template-columns:1fr 1fr}.big-btn{font-size:20px}.bb-ic{width:44px;height:44px}}

/* 게임 HUD */
.hud-card{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;background:rgba(255,253,246,.96);border-radius:18px;padding:12px 16px;min-width:230px;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.hud-kicker{font-family:var(--font-display);color:var(--teal);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-count{font-family:var(--font-display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}.hud-count small{font-size:15px;color:var(--muted)}
.hud-bar{height:8px;background:#e9e2d4;border-radius:99px;margin:8px 0 6px;overflow:hidden}.hud-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#3bc3a8);border-radius:99px;transition:width .4s}
.hud-sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.hud-sub .star{color:#f2b416}.hud-sub b{color:var(--ink)}
.hud-btns{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}
.hud-btn{display:flex;align-items:center;gap:6px;border:0;border-radius:16px;background:rgba(255,253,246,.96);padding:10px 14px;font-family:var(--font-display);font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.hud-btn:hover{background:#fff}
.gtoast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;background:var(--navy);color:#fff;font-family:var(--font-display);font-size:19px;padding:12px 22px;border-radius:14px;width:max-content;max-width:min(520px,calc(100vw - 600px));text-align:center;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.gtoast.on{opacity:1;transform:translate(-50%,0)}
.minimap{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border:3px solid #fff;border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22);width:220px}
.minimap canvas{display:block;width:100%;height:auto}.minimap span{display:block;background:var(--navy);color:#fff;font-family:var(--font-display);font-size:15px;padding:3px}
.dpad{position:absolute;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:168px;height:168px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px}
.dpad button{border:0;border-radius:16px;background:rgba(255,253,246,.92);box-shadow:0 4px 0 rgba(0,0,0,.18);font-size:22px;color:var(--teal);touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button.on{background:var(--teal);color:#fff;transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
#scr-game.quiz .hud-card,#scr-game.quiz .hud-btns,#scr-game.quiz .minimap,#scr-game.quiz .gtoast{display:none}
@media (max-width:900px){.gtoast{top:calc(max(12px,env(safe-area-inset-top)) + 128px);max-width:calc(100vw - 32px);font-size:17px}}
@media (max-width:640px){.hud-card{min-width:0;max-width:52vw;padding:8px 12px}.hud-count{font-size:22px}.hud-count small{display:none}.hud-btn span{display:none}.hud-btn{padding:10px}.minimap{width:130px}.minimap span{font-size:13px}.dpad{width:144px;height:144px}}

/* 문제 카드 */
.qpanel,.spanel{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(740px,calc(100vw - 20px));background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:14px 18px 16px;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(0,0,0,.25);display:grid;gap:10px;max-height:calc(100% - 200px);overflow:auto;animation:slidein .3s ease-out}
.spanel{top:22%}
.qp-head{display:flex;align-items:center;gap:8px}
.qp-num{font-family:var(--font-display);color:var(--muted);font-size:16px}
.qp-clock{font-family:var(--font-display);font-size:16px;font-variant-numeric:tabular-nums}.qp-clock b{font-size:26px;color:var(--teal);margin-right:2px}
.qp-q{font-family:var(--font-display);font-size:clamp(20px,2.7vw,28px);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.qp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qp-opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:17px;line-height:1.35;transition:border-color .15s,background .15s}
.qp-opt b{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;color:#fff;font-family:var(--font-display);font-weight:400;font-size:19px;flex:none}
.qp-opt:hover{border-color:#b9cfcd}
.qp-opt.on{border-color:var(--teal);background:#e3f5f2;box-shadow:0 0 0 3px rgba(29,138,135,.22)}
.qp-opts.ox .qp-opt{justify-content:center;font-family:var(--font-display);font-size:19px}.qp-opts.ox .ox-O b{background:var(--ox)}.qp-opts.ox .ox-X b{background:#ef4444}
.qp-timer{height:10px;background:#eee4d2;border-radius:99px;overflow:hidden}.qp-timer i{display:block;height:100%;width:100%;background:var(--teal);border-radius:99px}.qp-timer i.low{background:var(--bad)}
.qp-guide{font-size:15px;color:var(--muted);text-align:center}.qp-guide.shake{animation:shake .4s;color:var(--bad)}
.qp-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.sp-form{display:flex;gap:8px}.sp-form .text-in{flex:1}
.sp-hint{background:#fff8e6;border-radius:12px;padding:8px 12px}
@media (max-width:560px){.qp-opts{grid-template-columns:1fr}.qp-opts.compact{grid-template-columns:1fr 1fr}.hide-sm{display:none}.fb-title{font-size:21px}.fb-mark{width:50px;height:50px;font-size:32px}.qp-opt{padding:6px 10px;font-size:16px}.qpanel{padding:12px 14px}.sp-form{flex-direction:column}.spanel{top:12px}}
.fbpanel{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(580px,calc(100vw - 20px));background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:16px 20px 18px;text-align:center;display:grid;gap:10px;justify-items:center;box-shadow:0 6px 0 var(--ink),0 24px 50px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.fb-top{display:flex;align-items:center;gap:14px;text-align:left}
.fb-head{display:grid;gap:0}
.fb-mark{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:40px;color:#fff;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.fb-ok .fb-mark{background:var(--ok)}.fb-bad .fb-mark,.fb-retry .fb-mark{background:var(--bad)}
.fb-title{font-size:26px}
.fb-pts{font-family:var(--font-display);color:var(--gold-d);font-size:21px}
.fb-answer{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:18px;text-align:left}.fb-answer span{font-family:var(--font-display);color:#fff;background:var(--ok);border-radius:99px;padding:0 10px;font-size:15px;flex:none}
.fb-explain{background:#fff3d6;border-radius:12px;padding:10px 14px;font-size:16px;text-align:left;width:100%}

/* 모달 */
.modal-wrap{position:fixed;inset:0;background:rgba(20,30,30,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
.modal{background:var(--paper);border-radius:22px;width:min(480px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);border:2.5px solid var(--ink);animation:pop .25s ease-out}
.modal.wide{width:min(780px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px 20px}.modal-head h3{font-size:22px}
.modal-body{padding:6px 20px 14px;overflow:auto}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-text{font-size:17px}

/* 입력 */
.text-in,.code-input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.text-in:focus,.code-input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(29,138,135,.18)}
textarea.text-in{resize:vertical}
.text-in.big{font-size:22px;padding:12px 14px;font-family:var(--font-display)}
.code-input{font-size:15px;resize:vertical}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;word-break:break-all}
.field-label{display:block;font-family:var(--font-display);font-size:16px;margin:12px 0 6px}
.set-list{display:grid;margin-top:6px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-top:1px dashed var(--line);cursor:pointer;font-size:15px}
.switch{position:relative;width:46px;height:26px;flex:none}.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:#d9d1c2;border-radius:99px;transition:.2s}.switch i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--teal)}.switch input:checked+i::after{transform:translateX(20px)}.switch input:focus-visible+i{outline:3px solid var(--gold);outline-offset:2px}
.sel{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:#fff;max-width:62%}

/* 보관함 */
.lib-top{grid-template-columns:1fr auto;gap:16px;align-items:center}
.lib-new{display:grid;gap:8px;justify-items:end}.tpl-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.store-badge{display:inline-block;font-size:13px;border-radius:8px;padding:1px 8px;background:#e3f5f2;color:var(--teal-d)}.store-badge.local{background:#fff3dc;color:#8a5a00}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lib-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;box-shadow:0 8px 22px rgba(52,44,24,.1)}
.lib-card img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block;background:#dfe9d4}
.lib-body{padding:12px 14px 14px;display:grid;gap:6px;align-content:start}.lib-body h3{font-size:21px}
.lib-count{font-size:14px;color:var(--teal-d)}
.lib-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
@media (max-width:760px){.lib-top{grid-template-columns:1fr}.lib-new,.tpl-row{justify-items:start;justify-content:flex-start}}

/* 편집기 */
.ed-title{flex:1 1 220px;min-width:0;font-family:var(--font-display);font-size:24px;border:1.5px dashed transparent;background:transparent;border-radius:10px;padding:4px 8px;color:var(--ink)}
.ed-title:hover,.ed-title:focus{border-color:var(--line);background:#fff;outline:none}
.save-state{font-size:14px;color:var(--ok)}.save-state.busy{color:var(--muted)}
.ed-grid{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:16px;align-items:start}
.ed-col{display:grid;gap:16px}
@media (max-width:980px){.ed-grid{grid-template-columns:1fr}}

.mode-opt.on{border-color:var(--teal);background:#e3f5f2;box-shadow:0 0 0 3px rgba(29,138,135,.2)}
@media (max-width:560px){.mode-pick{grid-template-columns:1fr}}
.game-rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.game-rows li{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.gr-main{display:grid}.gr-main b{font-family:var(--font-display);font-weight:400;font-size:17px}
@media (max-width:640px){.game-rows li{grid-template-columns:1fr auto}}
.matrix th.gcol{white-space:normal;min-width:96px}.matrix th.gcol span{display:block;font-size:14px;line-height:1.25}.matrix th.gcol small{color:var(--muted);font-family:var(--font-body)}
.matrix td{white-space:nowrap}.matrix td small{color:var(--muted)}
.pct{display:inline-flex;align-items:center;gap:6px}.pct .bar{display:inline-block;width:56px;height:8px;border-radius:99px;background:#e8e0cf;overflow:hidden}.pct .bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.medal{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;margin-left:4px;color:#5a3a00;font-family:var(--font-display)}.medal.m1{background:#ffd75e}.medal.m2{background:#d9e2ea}.medal.m3{background:#f2c08f}
.det-game{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:#fff}
.det-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.det-head b{font-family:var(--font-display);font-weight:400}
.det-qs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.det-qs li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 4px;border-top:1px dashed var(--line)}
.det-qs li.ok .rv-mark{background:var(--ok)}.det-qs li.bad .rv-mark{background:var(--bad)}.det-qs li.none .rv-mark{background:#b9c0c6}
.join-big{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}.join-big p{margin:10px 0 2px;font-size:17px}
.join-url{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3vw,30px);word-break:break-all;color:var(--ink)}
.code-huge{display:block;font-family:var(--font-display);font-weight:400;font-size:clamp(46px,8vw,84px);letter-spacing:.14em;color:var(--teal-d);line-height:1.1}
.qr-box{display:grid;justify-items:center;gap:6px}.qr-box svg{width:100%;max-width:300px;height:auto;background:#fff;border-radius:12px}
@media (max-width:640px){.join-big{grid-template-columns:1fr}}

/* 로그인 카드 인쇄 */
#print-area{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #cv,#veil,#ui,#toast,.modal-wrap,.confetti{display:none!important}
  #print-area{display:block!important}
  .print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
  .pcard{border:1.5px dashed #888;border-radius:4mm;padding:4mm;break-inside:avoid;font-family:var(--font-body);color:#222}
  .pc-top{display:flex;justify-content:space-between;font-size:10pt;border-bottom:1px solid #ccc;padding-bottom:2mm;margin-bottom:2mm}.pc-top b{font-family:var(--font-display);font-weight:400}
  .pc-body{display:flex;gap:3mm;align-items:center}.pc-info{flex:1}
  .pc-row{display:flex;justify-content:space-between;font-size:10pt}.pc-row b{font-size:14pt;letter-spacing:.08em}
  .pc-name{font-family:var(--font-display);font-size:16pt;margin-top:1mm}
  .pc-qr svg{width:22mm;height:22mm}
  .pc-site{font-size:8pt;color:#666;margin-top:2mm;word-break:break-all}
}

@media (max-width:560px){.game-list .quiz-card{grid-template-columns:88px 1fr}.game-list .quiz-card img{width:88px}.game-list .quiz-card>.btn{grid-column:1/-1;justify-self:stretch;text-align:center}}

        <p class="lead">친구들 캐릭터가 함께 돌아다니는 맵에서 깃발 문제를 풀거나, 선생님이 낸 문제에 맞춰 모두 O·X 발판으로 달려가요. 점수는 실시간 순위로 나오고, 기록은 계속 저장돼요.</p>

      <button class="hud-btn" id="btn-map" type="button" aria-label="전체 지도"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span>지도</span></button>

    </div>

<script>
'use strict';
/* =========================================================
   그리기 도구 + 맵 4종 (햇살 마을 · 초록 숲 캠프 · 파란 바닷가 · 반짝 우주 기지)
   ========================================================= */
const CANVAS_FONT = "'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const TAU = Math.PI * 2;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rrPath(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fillRR(c,x,y,w,h,r,f){rrPath(c,x,y,w,h,r);c.fillStyle=f;c.fill();}
function ell(c,x,y,rx,ry,f){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);c.fillStyle=f;c.fill();}
function circ(c,x,y,r,f){c.beginPath();c.arc(x,y,Math.max(0.1,r),0,TAU);c.fillStyle=f;c.fill();}
function shadow(c,x,y,rx,ry,a){ell(c,x,y,rx,ry,'rgba(35,45,25,'+(a==null?0.2:a)+')');}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function shade(h,a){let[r,g,b]=hexRgb(h);if(a<0){r*=1+a;g*=1+a;b*=1+a;}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function makePattern(c,w,h,fn){const p=document.createElement('canvas');p.width=w;p.height=h;fn(p.getContext('2d'),w,h);return c.createPattern(p,'repeat');}

/* ---------- 바닥 무늬 ---------- */
function patBrick(c,base,mortar){return makePattern(c,64,32,p=>{p.fillStyle=mortar;p.fillRect(0,0,64,32);const cols=[base,shade(base,-0.05),shade(base,0.07),shade(base,-0.02)];let k=0;for(let row=0;row<2;row++){const off=row?16:0;for(let i=-1;i<3;i++){p.fillStyle=cols[(k++)%4];rrPath(p,i*32+off+1.5,row*16+1.5,29,13,3);p.fill();}}});}
function patSpeck(c,base,cols,n,size,seed){return makePattern(c,128,128,p=>{const r=mulberry32(seed);p.fillStyle=base;p.fillRect(0,0,128,128);for(let i=0;i<n;i++){p.fillStyle=cols[i%cols.length];const x=r()*128,y=r()*128,s=size*(0.5+r());for(const dx of[-128,0,128])for(const dy of[-128,0,128]){p.beginPath();p.ellipse(x+dx,y+dy,s,s*0.7,0,0,TAU);p.fill();}}});}
function patPlank(c,vertical){return makePattern(c,64,64,p=>{const cols=['#c99560','#bf8a55','#d3a06b','#c48f5a'];p.fillStyle='#8a5f38';p.fillRect(0,0,64,64);for(let i=0;i<4;i++){p.fillStyle=cols[i];if(vertical)p.fillRect(i*16+1,0,14,64);else p.fillRect(0,i*16+1,64,14);p.fillStyle='rgba(90,60,30,0.5)';if(vertical){p.fillRect(i*16+4,8+i*9,2,2);p.fillRect(i*16+10,40-i*5,2,2);}else{p.fillRect(8+i*9,i*16+4,2,2);p.fillRect(40-i*5,i*16+10,2,2);}}});}
function patMetal(c){return makePattern(c,80,80,p=>{p.fillStyle='#5a6079';p.fillRect(0,0,80,80);p.fillStyle='#636a85';p.fillRect(2,2,76,76);p.strokeStyle='#4a4f66';p.lineWidth=2;p.strokeRect(1,1,78,78);p.fillStyle='#7c84a3';for(const[x,y]of[[8,8],[72,8],[8,72],[72,72]]){p.beginPath();p.arc(x,y,2.4,0,TAU);p.fill();}p.fillStyle='rgba(255,255,255,0.05)';p.fillRect(2,2,76,20);});}
function patStars(c){return makePattern(c,256,256,p=>{const r=mulberry32(77);p.fillStyle='#141833';p.fillRect(0,0,256,256);for(let i=0;i<70;i++){const s=r()*1.6+0.4;p.fillStyle='rgba(255,255,255,'+(0.35+r()*0.6)+')';p.beginPath();p.arc(r()*256,r()*256,s,0,TAU);p.fill();}});}

function grassLot(c,x,y,w,h,rng,o){o=o||{};const base=o.base||'#8fcf5a';c.save();
  fillRR(c,x-9,y-9,w+18,h+18,24,o.curb||'#f4e6cf');c.strokeStyle='rgba(150,120,80,0.35)';c.lineWidth=2;rrPath(c,x-9,y-9,w+18,h+18,24);c.stroke();
  const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,shade(base,0.07));g.addColorStop(1,shade(base,-0.07));fillRR(c,x,y,w,h,16,g);
  rrPath(c,x,y,w,h,16);c.clip();
  const ig=c.createLinearGradient(0,y,0,y+20);ig.addColorStop(0,'rgba(40,80,20,0.25)');ig.addColorStop(1,'rgba(40,80,20,0)');c.fillStyle=ig;c.fillRect(x,y,w,20);
  const n=Math.floor(w*h/900);for(let i=0;i<n;i++){const px=x+rng()*w,py=y+rng()*h;c.fillStyle=rng()<0.5?shade(base,-0.12):shade(base,0.13);c.beginPath();c.ellipse(px,py,3+rng()*4,2+rng()*2,0,0,TAU);c.fill();}
  c.strokeStyle=shade(base,-0.24);c.lineWidth=1.6;for(let i=0;i<n/3;i++){const px=x+rng()*w,py=y+rng()*h;c.beginPath();c.moveTo(px-3,py-5);c.lineTo(px,py);c.lineTo(px+3,py-6);c.stroke();}
  c.restore();}
function dashedRing(c,x,y,r,col){c.save();c.setLineDash([10,9]);c.strokeStyle=col||'rgba(160,120,80,0.45)';c.lineWidth=3;c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();c.restore();}
function crosswalk(c,x,y,len,across,vertBars){c.fillStyle='rgba(255,255,255,0.85)';const n=Math.floor(len/26);for(let i=0;i<n;i++){if(vertBars)fillRR(c,x+i*26,y,15,across,3,'rgba(255,255,255,0.85)');else fillRR(c,x,y+i*26,across,15,3,'rgba(255,255,255,0.85)');}}

/* ---------- 라벨 · 말풍선 ---------- */
function drawLabel(c,text,x,y,o){o=o||{};const size=o.size||26;c.save();c.font=size+'px '+CANVAS_FONT;const tw=c.measureText(text).width;const w=tw+size*1.1,hh=size*1.55,bx=x-w/2,by=y-hh/2;
  c.shadowColor='rgba(0,0,0,0.2)';c.shadowBlur=10;c.shadowOffsetY=3;fillRR(c,bx,by,w,hh,hh/2,o.dark?'rgba(38,50,60,0.9)':'#fffdf6');
  c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;if(!o.dark){c.strokeStyle='rgba(120,95,60,0.35)';c.lineWidth=2;rrPath(c,bx+1,by+1,w-2,hh-2,hh/2);c.stroke();}
  c.fillStyle=o.dark?'#ffffff':'#2a3640';c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+size*0.06);c.restore();}
function wrapLines(c,text,maxW){const out=[];for(const para of String(text).split('\n')){let line='';for(const word of para.split(' ')){const test=line?line+' '+word:word;if(c.measureText(test).width<=maxW){line=test;continue;}if(line)out.push(line);if(c.measureText(word).width<=maxW){line=word;}else{let piece='';for(const ch of word){if(c.measureText(piece+ch).width>maxW){out.push(piece);piece=ch;}else piece+=ch;}line=piece;}}out.push(line);}return out;}
function drawBubble(c,x,y,text,o){o=o||{};const size=o.size||17;c.save();c.font=size+'px '+CANVAS_FONT;const lines=wrapLines(c,text,o.maxW||230).slice(0,4);const lh=size*1.3;let w=0;for(const l of lines)w=Math.max(w,c.measureText(l).width);w+=26;const hh=lines.length*lh+16;const bx=x-w/2,by=y-hh-12;
  c.shadowColor='rgba(0,0,0,0.18)';c.shadowBlur=8;c.shadowOffsetY=2;fillRR(c,bx,by,w,hh,12,o.bg||'#ffffff');c.beginPath();c.moveTo(x-8,by+hh-1);c.lineTo(x,y-2);c.lineTo(x+8,by+hh-1);c.closePath();c.fill();
  c.shadowColor='transparent';c.fillStyle=o.fg||'#24323c';c.textAlign='center';c.textBaseline='top';lines.forEach((l,i)=>c.fillText(l,x,by+8+i*lh));c.restore();}

/* ---------- 식물 · 소품 ---------- */
const TREE_PAL={green:['#a3dc62','#62b03c','#3c7f2a'],autumn:['#ffc865','#f28c28','#c4581a'],yellow:['#ffe680','#f4c534','#c9951a'],dark:['#7fbf55','#3f8a32','#285f22'],blossom:['#ffd6e7','#f7a3c4','#d97aa4']};
function drawTree(c,x,y,s,kind){s=s||1;if(kind==='pine')return drawPine(c,x,y,s);if(kind==='palm')return drawPalm(c,x,y,s);const p=TREE_PAL[kind]||TREE_PAL.green;
  shadow(c,x+9*s,y+2*s,40*s,13*s,0.22);c.fillStyle='#8b5a36';rrPath(c,x-6*s,y-32*s,12*s,34*s,4*s);c.fill();c.fillStyle='#6d4329';c.fillRect(x+1*s,y-30*s,4*s,30*s);
  const bl=[[0,-66,36],[-27,-50,25],[27,-50,25],[-16,-88,23],[17,-90,22],[0,-42,24]];
  for(const[bx,by,br]of bl)circ(c,x+bx*s,y+(by+4)*s,br*s,p[2]);
  for(const[bx,by,br]of bl){const g=c.createRadialGradient(x+(bx-br*0.35)*s,y+(by-br*0.45)*s,br*0.1*s,x+bx*s,y+by*s,br*s);g.addColorStop(0,p[0]);g.addColorStop(0.65,p[1]);g.addColorStop(1,p[2]);circ(c,x+bx*s,y+by*s,br*s*0.94,g);}
  c.fillStyle='rgba(255,255,255,0.22)';c.beginPath();c.ellipse(x-10*s,y-84*s,9*s,5*s,-0.5,0,TAU);c.fill();}
function drawPine(c,x,y,s){shadow(c,x+7*s,y+2*s,30*s,11*s,0.22);c.fillStyle='#7a4e2e';c.fillRect(x-5*s,y-20*s,10*s,22*s);

function makeM(){return{obs:[],marks:[],
  rect(x,y,w,h){this.obs.push({t:'r',x,y,w,h});},circle(x,y,r){this.obs.push({t:'c',x,y,r});},ellipse(x,y,rx,ry){this.obs.push({t:'e',x,y,rx,ry});},
  mark(x,y,r){this.marks.push({x,y,r});},freeMark(x,y,r){for(const m of this.marks)if(Math.hypot(m.x-x,m.y-y)<m.r+r)return false;return true;}};}
function clearOf(obs,x,y,r){for(const o of obs){if(o.t==='r'){const dx=Math.max(o.x-x,0,x-(o.x+o.w)),dy=Math.max(o.y-y,0,y-(o.y+o.h));if(dx*dx+dy*dy<r*r)return false;}else if(o.t==='c'){const dx=x-o.x,dy=y-o.y,q=o.r+r;if(dx*dx+dy*dy<q*q)return false;}else{const ex=(x-o.x)/(o.rx+r),ey=(y-o.y)/(o.ry+r);if(ex*ex+ey*ey<1)return false;}}return true;}
function distSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}
function minSegDist(px,py,segs){let m=1e9;for(const s of segs)m=Math.min(m,distSeg(px,py,s[0],s[1],s[2],s[3]));return m;}
function polySegs(polys){const out=[];for(const p of polys)for(let i=0;i<p.length-1;i++)out.push([p[i][0],p[i][1],p[i+1][0],p[i+1][1]]);return out;}
function strokePolys(c,polys){for(const p of polys){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.stroke();}}

function painter(c,M,seed){const rng=mulberry32(seed),props=[],labels=[];
  const P={c,M,rng,r:(a,b)=>a+rng()*(b-a),pick:a=>a[Math.floor(rng()*a.length)],
    add(y,fn){props.push({y,fn});},label(text,x,y,dark){labels.push({text,x,y,dark});},
    tree(x,y,kind,s){s=s||1;M.circle(x,y-4*s,12*s);M.mark(x,y-24*s,36*s);props.push({y,fn:()=>drawTree(c,x,y,s,kind||'green')});},
    bush(x,y,s,fl){M.mark(x,y,22*(s||1));props.push({y,fn:()=>drawBush(c,x,y,s||1,fl)});},
    lamp(x,y){M.circle(x,y-2,7);M.mark(x,y,16);props.push({y,fn:()=>drawLamp(c,x,y)});},
    bench(x,y,vert){if(vert)M.rect(x-14,y-34,24,68);else M.rect(x-34,y-24,68,30);M.mark(x,y,42);props.push({y,fn:()=>drawBench(c,x,y,vert)});},
    rock(x,y,s,col){M.circle(x,y-6,14*(s||1));M.mark(x,y,26*(s||1));props.push({y,fn:()=>drawRock(c,x,y,s,col)});},
    flowers(x,y,cols){M.mark(x,y,26);drawFlowers(c,x,y,cols,rng);},
    building(b){M.rect(b.x+4,b.y+10,b.w-8,b.h-12);M.mark(b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h)*0.62);props.push({y:b.y+b.h,fn:()=>drawBuilding(c,b)});
      if(b.label){const ly=b.style==='flat'?b.y+b.h*0.2:b.style==='dome'?b.y+b.h*0.42:b.style==='tent'?b.y+b.h*0.3:b.y+b.h*0.34;labels.push({text:b.label,x:b.x+b.w/2,y:b.labelY||ly});}},
    scatter(n,area,minR,ok,place){let made=0;for(let t=0;t<n*40&&made<n;t++){const x=area.x+rng()*area.w,y=area.y+rng()*area.h;if(ok&&!ok(x,y))continue;if(!M.freeMark(x,y,minR))continue;if(!clearOf(M.obs,x,y,minR*0.7))continue;place(x,y);made++;}},
    flush(){props.sort((a,b)=>a.y-b.y);for(const p of props)p.fn();for(const l of labels)drawLabel(c,l.text,l.x,l.y,{dark:l.dark});}};
  return P;}

function padPositions(x,y,axis,n,ox,big){const sp=big?(ox?170:184):(ox?125:138);const out=[];for(let i=0;i<n;i++){const o=ox?(i===0?-sp:sp):(i-(n-1)/2)*sp;out.push(axis==='h'?{x:x+o,y}:{x,y:y+o});}return out;}

function computeCandidates(map,M){const out=[];for(const[x1,y1,x2,y2]of map.segs){const len=Math.hypot(x2-x1,y2-y1);const axis=Math.abs(x2-x1)>=Math.abs(y2-y1)?'h':'v';for(let d=40;d<len-30;d+=45){const x=x1+(x2-x1)*d/len,y=y1+(y2-y1)*d/len;if(!clearOf(M.obs,x,y,40))continue;const lv=layoutOk(M,map,x,y,axis,4,false)?3:layoutOk(M,map,x,y,axis,2,true)?2:1;out.push({x,y,axis,lv});}}return out;}

  while(pick.length<n&&pool.length){let best=null,bd=-1;for(const c of pool){let m=1e9;for(const a of anchors)m=Math.min(m,Math.hypot(c.x-a.x,c.y-a.y)*1.6);for(const p of pick)m=Math.min(m,Math.hypot(c.x-p.x,c.y-p.y));m+=c.j;if(m>bd){bd=m;best=c;}}pick.push(best);pool=pool.filter(c=>c!==best);}

function normalizeQ(q){if(!q||typeof q!=='object')return null;const type=['ox','mc','short'].includes(q.type)?q.type:null;if(!type)return null;
  const o={id:String(q.id||uid()).replace(/[^a-z0-9]/gi,'').slice(0,30)||uid(),type,q:String(q.q==null?'':q.q).slice(0,400),hint:String(q.hint||'').slice(0,200),explain:String(q.explain||'').slice(0,300),on:q.on!==false};

  else if(type==='mc'){o.options=(Array.isArray(q.options)?q.options:[]).slice(0,4).map(x=>String(x==null?'':x).slice(0,120));while(o.options.length<2)o.options.push('');o.answer=clamp(parseInt(q.answer,10)||0,0,o.options.length-1);}

  async function loadList(){listBox.innerHTML='';let games=[];try{games=await tcall('t_games',{p_class:D.classId});}catch(e){if(e.code!=='AUTH')listBox.append(h('p',{class:'muted'},errText(e)));return;}
    if(!games.length){listBox.append(h('p',{class:'muted'},'아직 연 게임이 없어요.'));return;}
    listBox.append(h('ol',{class:'game-rows'},games.map(g=>h('li',null,h('div',{class:'gr-main'},h('b',null,g.title),h('span',{class:'muted small'},modeName(g.mode)+' · '+MAPS[g.map].name+' · '+g.total+'문제 · '+fmtKST(Date.parse(g.created_at)))),h('span',{class:'status-pill',dataset:{s:g.status}},statusName(g.status)),h('span',{class:'muted small'},'참여 '+g.players+'명'),
      h('div',{class:'row-acts'},h('button',{class:'btn sm '+(g.status==='ended'?'':'primary'),type:'button',onclick:()=>openRun(g.id)},g.status==='ended'?'결과':'진행 화면'),
        h('button',{class:'icon-btn danger',type:'button','aria-label':g.title+' 삭제',onclick:async()=>{if(!await askConfirm('「'+g.title+'」 게임을 지울까요? 이 게임의 학생 기록도 함께 지워져요.','지우기',true))return;try{await tcall('t_game_delete',{p_game:g.id});loadList();}catch(e){if(e.code!=='AUTH')toast(errText(e));}}},icon('trash')))))));}
  loadList();}

/* 기록 */
async function renderRecordsTab(body){if(!D.classes.length){body.append(h('div',{class:'empty'},h('b',null,'먼저 반을 만들어 주세요.')));return;}
  const box=h('div');body.append(h('section',{class:'card'},h('div',{class:'bank-head'},h('h3',{class:'card-title'},'학생별 기록'),h('span',{class:'grow'}),classSelect(()=>load())),h('p',{class:'muted small'},'학생 이름을 누르면 게임마다 어떤 문제를 맞히고 틀렸는지 볼 수 있어요. 점수 옆 숫자는 맞힌 문제 수예요.'),box));
  async function load(){box.innerHTML='';let d;try{d=await tcall('t_records',{p_class:D.classId});}catch(e){if(e.code!=='AUTH')box.append(h('p',{class:'muted'},errText(e)));return;}
    if(!d.students.length){box.append(h('p',{class:'muted'},'이 반에는 아직 학생이 없어요.'));return;}
    const cell={};for(const c of d.cells)cell[c.g+'|'+c.s]=c;const games=d.games;
    const sum=s=>{let n=0,ok=0,tot=0,sc=0;for(const g of games){const c=cell[g.id+'|'+s.id];if(c){n++;ok+=c.ok;tot+=g.total;sc+=c.score;}}return{n,ok,tot,sc,pct:tot?Math.round(ok/tot*100):null};};
    const tsv=()=>[['번호','이름','참여 게임','정답률(%)','총점'].concat(games.map(g=>g.title+' ('+fmtKST(Date.parse(g.created_at))+')')).join('\t')].concat(d.students.map(s=>{const m=sum(s);return[s.num,s.name,m.n,m.pct==null?'':m.pct,m.sc].concat(games.map(g=>{const c=cell[g.id+'|'+s.id];return c?c.score+'점 '+c.ok+'/'+g.total+' '+c.rank+'등':'';})).join('\t');})).join('\n');
    box.append(h('div',{class:'row-end'},h('button',{class:'btn sm',type:'button',onclick:()=>copyText(tsv())},icon('copy'),'표로 복사 (스프레드시트에 붙여 넣기)')),
      h('div',{class:'table-wrap'},h('table',{class:'rec-table matrix'},h('thead',null,h('tr',null,h('th',null,'번호'),h('th',null,'이름'),h('th',null,'참여'),h('th',null,'정답률'),games.map(g=>h('th',{class:'gcol'},h('span',null,g.title),h('small',null,fmtKST(Date.parse(g.created_at)).slice(0,12)))))),
        h('tbody',null,d.students.map(s=>{const m=sum(s);return h('tr',null,h('td',{class:'num'},String(s.num)),h('td',null,h('button',{class:'link-btn',type:'button',onclick:()=>openStudentDetail(s.id)},s.name)),h('td',{class:'num'},m.n+'회'),h('td',{class:'num'},m.pct==null?'-':h('span',{class:'pct'},h('span',{class:'bar'},h('i',{style:'width:'+m.pct+'%'})),h('b',null,m.pct+'%'))),
          games.map(g=>{const c=cell[g.id+'|'+s.id];return h('td',{class:'num'},c?[h('b',null,String(c.score)),h('small',null,' '+c.ok+'/'+g.total),c.rank<=3?h('span',{class:'medal m'+c.rank},String(c.rank)):null]:h('span',{class:'muted'},'-'));}));})))));}
  load();}
function givenText(q,g){if(g==null||g==='')return'(답 없음)';if(q.type==='mc'){const i=parseInt(g,10);return isNaN(i)?g:(i+1)+'번 '+(q.options[i]||'');}return g;}
async function openStudentDetail(id){let d;try{d=await tcall('t_student_detail',{p_student:id});}catch(e){if(e.code!=='AUTH')toast(errText(e));return;}
  const body=h('div',{class:'detail'});if(!d.games.length)body.append(h('p',{class:'muted'},'아직 참여한 게임이 없어요.'));
  for(const g of d.games){const by={};for(const a of g.answers)(by[a.q]=by[a.q]||[]).push(a);
    body.append(h('section',{class:'det-game'},h('div',{class:'det-head'},h('b',null,g.title),h('span',{class:'muted small'},modeName(g.mode)+' · '+fmtKST(Date.parse(g.created_at))),h('span',{class:'grow'}),h('span',{class:'rank-pill'+(g.rank<=3?' top':'')},g.rank+'등 / '+g.players+'명'),h('b',null,g.score+'점 · '+g.ok+'/'+g.total)),
      h('ol',{class:'det-qs'},g.questions.slice(0,g.total).map((q,i)=>{const as=by[i]||[];const ok=as.some(a=>a.correct);return h('li',{class:as.length?(ok?'ok':'bad'):'none'},h('span',{class:'rv-mark'},as.length?(ok?'O':'X'):'-'),h('div',null,h('div',{class:'rv-q'},chip(q.type),' ',q.q),
        h('div',{class:'rv-a'},'정답: '+answerText(q)+(as.length?' · 학생 답: '+as.map(a=>givenText(q,a.given)).join(' → '):' · 풀지 않았어요'))));}))));}
  openModal(d.student.num+'번 '+d.student.name+' 기록',body,null,{wide:true,noFocus:true});}

/* =========================================================
   입력 · 시작
   ========================================================= */
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
function isTyping(t){return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);}
function bindInput(){
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length){modalStack[modalStack.length-1].close();return;}if(isTyping(e.target)||G.mode!=='play'||modalStack.length)return;const k=KEYMAP[e.key];if(k){G.keys[k]=true;e.preventDefault();return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.tagName!=='BUTTON'&&G.state==='pad'){confirmPad();e.preventDefault();}});
  window.addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)G.keys[k]=false;});window.addEventListener('blur',()=>{G.keys={};G.dpad={x:0,y:0};});
  CV.addEventListener('pointerdown',e=>{if(G.mode!=='play'||G.paused||!canMove())return;Sound.ensure();const z=G.cam.z,wx=G.cam.x+e.clientX/z,wy=G.cam.y+e.clientY/z;
    if(G.live||(G.state==='pad'&&G.cur&&G.cur.ghost)){G.path=[{x:clamp(wx,30,G.map.W-30),y:clamp(wy,30,G.map.H-30)}];}else{const p=findPath(G.player.x,G.player.y,wx,wy);if(!p||!p.length)return;G.path=p;}const t=G.path[G.path.length-1];G.clickFx={x:t.x,y:t.y,life:0.6};});
  for(const b of document.querySelectorAll('#dpad [data-dx]')){const dx=+b.dataset.dx,dy=+b.dataset.dy;const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}G.dpad={x:dx,y:dy};b.classList.add('on');Sound.ensure();};const off=()=>{G.dpad={x:0,y:0};b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());}
  $('#btn-note').onclick=openNotebook;$('#btn-set').onclick=openGameSettings;$('#minimap-btn').onclick=openBigMap;$('#btn-map').onclick=openBigMap;
  $('#go-student').onclick=()=>{Sound.ensure();if(Auth.s)openLobby();else openSLogin();};$('#go-teacher').onclick=()=>{if(Auth.t)openDash('class');else openTLogin();};
  window.addEventListener('resize',()=>{resizeCanvas();applyDpad();});setInterval(drawMinimap,200);}
async function boot(){CV=$('#cv');CX=CV.getContext('2d');resizeCanvas();bindInput();applyDpad();requestAnimationFrame(frame);renderHome();
  try{await Promise.race([document.fonts.ready.then(()=>Promise.all([document.fonts.load('30px Jua'),document.fonts.load('16px "Gowun Dodum"')])),sleep(2500)]);}catch(e){}
  loadMap('village');G.camSnap=true;
  const qs=new URLSearchParams(location.search);const code=qs.get('c');if(code){history.replaceState(null,'',location.pathname);if(Auth.s&&Auth.s.class&&Auth.s.class.code===code.toUpperCase()){openLobby();return;}openSLogin(code);return;}
  if(SCREEN!=='home')return;if(Auth.s&&!Auth.t){try{const me=await api('s_me',{p_token:Auth.s.token});Auth.s.student=me.student;Auth.s.class=me.class;LS.set('qc_s',Auth.s);openLobby();}catch(e){if(e.code==='AUTH'){Auth.s=null;LS.set('qc_s',null);}}}}
boot();
